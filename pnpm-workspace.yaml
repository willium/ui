packages:
  - ai-docs
  - examples/*
  - packages/*
  - packages/tools/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
# pnpm 11 aborts a tarball download that has not finished within fetchTimeout (default 60s),
# however fast it is still progressing.
fetchTimeout: 180000

allowBuilds:
  core-js: false
  dprint: false
  esbuild: false

patchedDependencies:
  '@changesets/cli@3.0.3': patches/@changesets__cli@3.0.3.patch
  '@changesets/get-github-info@1.0.1': patches/@changesets__get-github-info@1.0.1.patch
minimumReleaseAgeExclude:
  - '@opentui/core-darwin-arm64@0.9.9'
  - '@opentui/core-darwin-x64@0.9.9'
  - '@opentui/core-linux-arm64-musl@0.9.9'
  - '@opentui/core-linux-arm64@0.9.9'
  - '@opentui/core-linux-x64-musl@0.9.9'
  - '@opentui/core-linux-x64@0.9.9'
  - '@opentui/core-win32-arm64@0.9.9'
  - '@opentui/core-win32-x64@0.9.9'
  - '@opentui/core@0.9.9'
  - effect@4.1.6
  - '@effect/vitest@4.1.6'
  - '@expo/cli@58.1.22'
  - '@expo/config-plugins@58.0.14'
  - '@expo/config@58.0.13'
  - '@expo/fingerprint@0.22.0'
  - '@expo/inline-modules@0.2.11'
  - '@expo/local-build-cache-provider@58.0.13'
  - '@expo/metro-config@58.0.24'
  - '@expo/metro-file-map@58.0.7'
  - '@expo/prebuild-config@58.0.21'
  - '@expo/router-server@58.0.24'
  - babel-preset-expo@58.0.27
  - expo-dev-client@58.0.22
  - expo-dev-launcher@58.1.0
  - expo-file-system@58.0.15
  - expo-modules-core@58.2.0
  - expo-modules-jsi@58.0.24
  - expo@58.1.0
